<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Watchwise</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Watchwise</h1>
    <p class="muted">When enabled, Watchwise saves the page title, website/path, and playback timing on this Mac. Query strings are removed except the YouTube video ID.</p>
    <label class="row"><span>Track videos on websites</span><input id="tracking" type="checkbox"></label>
    <label class="row"><span>Connect to Mac app</span><input id="bridge" type="checkbox"></label>
    <p class="muted"><strong>Movie Mode:</strong> use the Watchwise Mac app to silence nudges while continuing private usage accounting.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
