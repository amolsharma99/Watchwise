<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Watchwise in-page nudge previews</title>
  <desc id="desc">Three illustrated video pages each show a real Watchwise message in a translucent ink and caramel toast. The video pages are synthetic.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F2EFE9"/>
      <stop offset="1" stop-color="#E6D9C8"/>
    </linearGradient>
    <linearGradient id="player" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#35312A"/>
      <stop offset=".58" stop-color="#24231F"/>
      <stop offset="1" stop-color="#55402F"/>
    </linearGradient>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#362B20" flood-opacity=".16"/>
    </filter>
    <filter id="toast-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .heading{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2.6px;fill:#8B6747}
      .subheading{font:600 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.5px;fill:#252420}
      .page-label{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.4px;fill:#AFA08D}
      .brand{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.4px;fill:#D4A16F}
      .message{font:600 16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#FAF7F1}
      .dismiss{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#FAF7F1}
      .footer{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#795D42}
    </style>
  </defs>

  <rect width="1200" height="590" fill="url(#canvas)"/>
  <circle cx="1094" cy="74" r="153" fill="#D5B99A" opacity=".14"/>
  <circle cx="1115" cy="79" r="104" fill="none" stroke="#B78D64" stroke-width="1" opacity=".22"/>
  <text class="heading" x="38" y="43">WATCHWISE NUDGES</text>
  <text class="subheading" x="38" y="77">A moment to choose what happens next.</text>

  <!-- Each panel is an independent synthetic video-page preview. -->
  <g transform="translate(34 103)">
    <rect width="366" height="431" rx="22" fill="#1B1A17" stroke="#51483C" filter="url(#panel-shadow)"/>
    <circle cx="24" cy="27" r="4" fill="#A27452"/><circle cx="39" cy="27" r="4" fill="#5C5044"/><circle cx="54" cy="27" r="4" fill="#5C5044"/>
    <rect x="17" y="51" width="332" height="252" rx="14" fill="url(#player)"/>
    <text class="page-label" x="32" y="75">DEMO VIDEO PAGE</text>
    <circle cx="183" cy="164" r="32" fill="#F6F1E8" opacity=".16"/>
    <path d="M175 147l24 17-24 17z" fill="#F6F1E8"/>
    <rect x="34" y="275" width="296" height="4" rx="2" fill="#D6C5AF" opacity=".28"/>
    <rect x="34" y="275" width="118" height="4" rx="2" fill="#D4A16F"/>
    <rect x="34" y="221" width="298" height="186" rx="16" fill="#252420" fill-opacity=".96" stroke="#766352" stroke-opacity=".58" filter="url(#toast-shadow)"/>
    <text class="brand" x="50" y="246">WATCHWISE</text>
    <text class="message" x="50" y="276">
      <tspan x="50" dy="0">This video has a retention</tspan>
      <tspan x="50" dy="23">strategy. Do you have an</tspan>
      <tspan x="50" dy="23">exit strategy? 👀</tspan>
    </text>
    <rect x="249" y="359" width="68" height="31" rx="9" fill="#FFFFFF" fill-opacity=".12"/>
    <text class="dismiss" x="264" y="379">Dismiss</text>
  </g>

  <g transform="translate(417 103)">
    <rect width="366" height="431" rx="22" fill="#1B1A17" stroke="#51483C" filter="url(#panel-shadow)"/>
    <circle cx="24" cy="27" r="4" fill="#A27452"/><circle cx="39" cy="27" r="4" fill="#5C5044"/><circle cx="54" cy="27" r="4" fill="#5C5044"/>
    <rect x="17" y="51" width="332" height="252" rx="14" fill="url(#player)"/>
    <text class="page-label" x="32" y="75">DEMO VIDEO PAGE</text>
    <circle cx="183" cy="164" r="32" fill="#F6F1E8" opacity=".16"/>
    <path d="M175 147l24 17-24 17z" fill="#F6F1E8"/>
    <rect x="34" y="275" width="296" height="4" rx="2" fill="#D6C5AF" opacity=".28"/>
    <rect x="34" y="275" width="92" height="4" rx="2" fill="#D4A16F"/>
    <rect x="34" y="221" width="298" height="186" rx="16" fill="#252420" fill-opacity=".96" stroke="#766352" stroke-opacity=".58" filter="url(#toast-shadow)"/>
    <text class="brand" x="50" y="246">WATCHWISE</text>
    <text class="message" x="50" y="276">
      <tspan x="50" dy="0">Your question matters</tspan>
      <tspan x="50" dy="23">more than the intro. If this</tspan>
      <tspan x="50" dy="23">isn't helping, please move</tspan>
      <tspan x="50" dy="23">on. ✨</tspan>
    </text>
    <rect x="249" y="359" width="68" height="31" rx="9" fill="#FFFFFF" fill-opacity=".12"/>
    <text class="dismiss" x="264" y="379">Dismiss</text>
  </g>

  <g transform="translate(800 103)">
    <rect width="366" height="431" rx="22" fill="#1B1A17" stroke="#51483C" filter="url(#panel-shadow)"/>
    <circle cx="24" cy="27" r="4" fill="#A27452"/><circle cx="39" cy="27" r="4" fill="#5C5044"/><circle cx="54" cy="27" r="4" fill="#5C5044"/>
    <rect x="17" y="51" width="332" height="252" rx="14" fill="url(#player)"/>
    <text class="page-label" x="32" y="75">DEMO VIDEO PAGE</text>
    <circle cx="183" cy="164" r="32" fill="#F6F1E8" opacity=".16"/>
    <path d="M175 147l24 17-24 17z" fill="#F6F1E8"/>
    <rect x="34" y="275" width="296" height="4" rx="2" fill="#D6C5AF" opacity=".28"/>
    <rect x="34" y="275" width="152" height="4" rx="2" fill="#D4A16F"/>
    <rect x="34" y="221" width="298" height="186" rx="16" fill="#252420" fill-opacity=".96" stroke="#766352" stroke-opacity=".58" filter="url(#toast-shadow)"/>
    <text class="brand" x="50" y="246">WATCHWISE</text>
    <text class="message" x="50" y="276">
      <tspan x="50" dy="0">Plot twist: you can leave</tspan>
      <tspan x="50" dy="23">before the outro. 🎬</tspan>
    </text>
    <rect x="249" y="359" width="68" height="31" rx="9" fill="#FFFFFF" fill-opacity=".12"/>
    <text class="dismiss" x="264" y="379">Dismiss</text>
  </g>

  <text class="footer" x="38" y="568">There are more. We hope you won't see them all.</text>
</svg>
